
spring.application.name=ujay-backend

server.port=${PORT:8080}

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ujay_wjcp}
spring.datasource.username=${DB_USER:ujay_user}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Run initialization after Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Render health check
management.endpoints.web.exposure.include=health